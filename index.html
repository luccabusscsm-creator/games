<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎮 Luquinha Games</title>

<style>

/* ===== GERAL ===== */

body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow-x:hidden;
text-align:center;
}

/* ===== FUNDO ESPACIAL ===== */

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* ===== TELA DE CARREGAMENTO ===== */

#loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 1s forwards;
animation-delay:4s;
}

#loadingText{
font-size:55px;
color:#00ffff;
text-shadow:
0 0 10px cyan,
0 0 20px cyan,
0 0 40px cyan;
animation:pulse 1.5s infinite;
}

.loader{
margin-top:20px;
width:70px;
height:70px;
border:6px solid #222;
border-top:6px solid cyan;
border-radius:50%;
animation:spin 1s linear infinite;
}

/* ===== TOPO ===== */

h1{
margin-top:20px;
font-size:45px;
text-shadow:0 0 20px cyan;
}

/* ===== LOGIN ===== */

#loginBox{
margin-top:20px;
}

input{
padding:10px;
border:none;
border-radius:10px;
width:220px;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#00ffff;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

button:hover{
background:#00bbbb;
transform:scale(1.05);
}

/* ===== PERFIL ===== */

#profile{
margin:20px;
font-size:20px;
}

/* ===== JOGOS ===== */

.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#111;
border-radius:15px;
padding:20px;
transition:.3s;
cursor:pointer;
box-shadow:0 0 15px rgba(0,255,255,.3);
}

.card:hover{
transform:scale(1.08);
box-shadow:0 0 30px cyan;
}

.icon{
font-size:70px;
}

/* ===== ESTRELAS ===== */

.stars{
margin-top:10px;
}

.stars span{
font-size:22px;
cursor:pointer;
}

/* ===== LEADERBOARD ===== */

#leaderboard{
background:#111;
margin:30px;
padding:20px;
border-radius:15px;
box-shadow:0 0 20px cyan;
}

#leaderboard h2{
margin-top:0;
}

li{
margin:8px;
}

/* ===== ANIMAÇÕES ===== */

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.1);
}

100%{
transform:scale(1);
}

}

@keyframes fadeOut{

to{
opacity:0;
visibility:hidden;
}

}

</style>
</head>

<body>

<!-- ===== LOADING ===== -->

<div id="loading">

<h1 id="loadingText">
🎮 LUQUINHA GAMES
</h1>

<div class="loader"></div>

</div>

<!-- ===== FUNDO ===== -->

<canvas id="space"></canvas>

<!-- ===== TITULO ===== -->

<h1>🎮 LUQUINHA GAMES</h1>

<!-- ===== LOGIN ===== -->

<div id="loginBox">

<input id="name" placeholder="Digite seu nome">

<button onclick="login()">
Entrar
</button>

</div>

<!-- ===== PERFIL ===== -->

<div id="profile"></div>

<!-- ===== JOGOS ===== -->

<div class="games">

<!-- CAPY CARE -->

<div class="card"
onclick="play('https://luquinha835.github.io/capy-care-/','Capy Care')">

<div class="icon">🐹</div>

<h3>Capy Care</h3>

<div class="stars">

<span onclick="rate(event,'capy',1)">⭐</span>
<span onclick="rate(event,'capy',2)">⭐</span>
<span onclick="rate(event,'capy',3)">⭐</span>
<span onclick="rate(event,'capy',4)">⭐</span>
<span onclick="rate(event,'capy',5)">⭐</span>

</div>

</div>

<!-- FLYPY -->

onclick="play('https://luquinha835.github.io/flypy-plane/','Flypy Plane')">

<h3>Flypy Plane</h3>

<div class="stars">

<span onclick="rate(event,'plane',1)">⭐</span>

<span onclick="rate(event,'plane',3)">⭐</span>
<span onclick="rate(event,'plane',4)">⭐</span>
<span onclick="rate(event,'plane',5)">⭐</span>

<!-- NAVE -->

<div class="card"

<div class="stars">

<span onclick="rate(event,'nave',4)">⭐</span>
<span onclick="rate(event,'nave',5)">⭐</span>

<!-- MATEMÁTICA -->

<div class="card"
onclick="play('https://luquinha835.github.io/desfio-matematico','Matemática')">

<div class="icon">🧠</div>

<span onclick="rate(event,'math',1)">⭐</span>
<span onclick="rate(event,'math',2)">⭐</span>
<span onclick="rate(event,'math',3)">⭐</span>
<span onclick="rate(event,'math',4)">⭐</span>
<span onclick="rate(event,'math',5)">⭐</span>

<!-- MARMOTA -->

<div class="card"
onclick="play('https://luquinha835.github.io/marmot-game','Marmota')">

<span onclick="rate(event,'terror',3)">⭐</span>
<span onclick="rate(event,'terror',4)">⭐</span>
<span onclick="rate(event,'terror',5)">⭐</span>

</div>

</div>

</div>

<!-- ===== LEADERBOARD ===== -->

<div id="leaderboard">

<h2>🏆 Ranking Global</h2>

<ul id="rankList"></ul>

</div>

<script>

/* ===== LOGIN ===== */

let player=""

function login(){

player=document.getElementById("name").value

if(!player){

alert("Digite seu nome")

return

}

localStorage.setItem("player",player)

document.getElementById("profile").innerHTML=
"🧑‍🚀 Jogador: "+player

updateRank()

}

window.onload=function(){

player=localStorage.getItem("player")

if(player){

document.getElementById("profile").innerHTML=
"🧑‍🚀 Jogador: "+player

}

updateRank()

}

/* ===== JOGAR ===== */

function play(url,game){

let score=Math.floor(Math.random()*100)

let data=JSON.parse(localStorage.getItem("scores")||"[]")

data.push({
name:player || "Anônimo",
game:game,
score:score
})

localStorage.setItem("scores",JSON.stringify(data))

window.open(url,"_blank")

updateRank()

}

/* ===== RANK ===== */

function updateRank(){

let data=JSON.parse(localStorage.getItem("scores")||"[]")

data.sort((a,b)=>b.score-a.score)

let html=""

data.slice(0,10).forEach(p=>{

html+=`
<li>
${p.name} - ${p.game} (${p.score} pts)
</li>
`

})

document.getElementById("rankList").innerHTML=html

}

/* ===== ESTRELAS ===== */

function rate(e,game,value){

e.stopPropagation()

localStorage.setItem("rate_"+game,value)

alert("Você avaliou "+value+" estrelas ⭐")

}

/* ===== FUNDO ESPACIAL ===== */

const canvas=document.getElementById("space")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let stars=[]

for(let i=0;i<150;i++){

stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2
})

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="white"

stars.forEach(s=>{

ctx.beginPath()

ctx.arc(s.x,s.y,s.r,0,Math.PI*2)

ctx.fill()

s.y+=0.3

if(s.y>canvas.height){
s.y=0
}

})

requestAnimationFrame(draw)

}

draw()

</script>

</body>
</html>
