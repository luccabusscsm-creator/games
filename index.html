<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luquinha Games</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0b0f1a;
color:white;
}

/* topo */

header{
background:#111;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 0 20px cyan;
}

.logo{
font-size:26px;
color:#00ffff;
}

/* ranking */

#ranking{
padding:20px;
background:#0e1424;
}

#ranking h2{
margin-top:0;
}

/* biblioteca */

.games{
display:flex;
flex-wrap:wrap;
gap:25px;
padding:30px;
justify-content:center;
}

/* card */

.card{
background:#1b1b1b;
width:260px;
border-radius:12px;
overflow:hidden;
transition:.3s;
box-shadow:0 0 15px rgba(0,255,255,.2);
position:relative;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 30px cyan;
}

.poster{
width:100%;
height:150px;
object-fit:cover;
}

/* trailer */

.trailer{
position:absolute;
top:0;
left:0;
width:100%;
height:150px;
display:none;
}

.card:hover .trailer{
display:block;
}

/* conteudo */

.content{
padding:15px;
text-align:center;
}

button{
padding:8px 15px;
border:none;
border-radius:8px;
background:#00ffff;
cursor:pointer;
margin-top:8px;
}

button:hover{
background:#00bbbb;
}

/* estrelas */

.stars{
margin-top:8px;
}

.star{
font-size:20px;
cursor:pointer;
color:#555;
}

.star.active{
color:gold;
}

</style>
</head>

<body>

<header>
<div class="logo">🎮 LUQUINHA GAMES</div>
<div>Jogos do navegador</div>
</header>

<section id="ranking">
<h2>🏆 Ranking de Jogos</h2>
<ol id="rankList"></ol>
</section>

<section class="games" id="games"></section>

<script>

const games = [

{
name:"Capy Care",
link:"https://luquinha835.github.io/capy-care-/",
poster:"https://images.unsplash.com/photo-1552410260-0fd9b577afa6",
trailer:"https://www.youtube.com/embed/aqz-KE-bpKQ"
},

{
name:"Flypy Plane",
link:"https://luquinha835.github.io/flypy-plane/",
poster:"https://images.unsplash.com/photo-1508614589041-895b88991e3e",
trailer:"https://www.youtube.com/embed/aqz-KE-bpKQ"
},

{
name:"Nave Space",
link:"https://luquinha835.github.io/nave-game",
poster:"https://images.unsplash.com/photo-1446776653964-20c1d3a81b06",
trailer:"https://www.youtube.com/embed/aqz-KE-bpKQ"
},

{
name:"Desafio Matemático",
link:"https://luquinha835.github.io/desfio-matematico",
poster:"https://images.unsplash.com/photo-1509228468518-180dd4864904",
trailer:"https://www.youtube.com/embed/aqz-KE-bpKQ"
},

{
name:"Bater na Marmota",
link:"https://luquinha835.github.io/marmot-game",
poster:"https://images.unsplash.com/photo-1518791841217-8f162f1e1131",
trailer:"https://www.youtube.com/embed/aqz-KE-bpKQ"
},

{
name:"Minecraft Classic",
link:"https://classic.minecraft.net",
poster:"https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png",
trailer:"https://www.youtube.com/embed/MmB9b5njVbA"
}

]

const container = document.getElementById("games")

games.forEach((game,i)=>{

let rating = localStorage.getItem("rating_"+game.name) || 0

const card=document.createElement("div")
card.className="card"

card.innerHTML=`

<img class="poster" src="${game.poster}">

<iframe class="trailer"
src="${game.trailer}"
frameborder="0"
allowfullscreen>
</iframe>

<div class="content">

<h3>${game.name}</h3>

<button onclick="window.open('${game.link}','_blank')">
Jogar
</button>

<div class="stars" data-game="${game.name}">
${[1,2,3,4,5].map(n=>`<span class="star ${n<=rating?"active":""}" data-value="${n}">★</span>`).join("")}
</div>

</div>
`

container.appendChild(card)

})

/* estrelas */

document.addEventListener("click",(e)=>{

if(e.target.classList.contains("star")){

const stars=e.target.parentElement.querySelectorAll(".star")
const value=e.target.dataset.value
const game=e.target.parentElement.dataset.game

stars.forEach((s,i)=>{

if(i<value){
s.classList.add("active")
}else{
s.classList.remove("active")
}

})

localStorage.setItem("rating_"+game,value)

updateRanking()

}

})

/* ranking */

function updateRanking(){

let data=[]

games.forEach(g=>{

let r=localStorage.getItem("rating_"+g.name) || 0
data.push({name:g.name,rating:Number(r)})

})

data.sort((a,b)=>b.rating-a.rating)

const list=document.getElementById("rankList")
list.innerHTML=""

data.forEach(g=>{

let li=document.createElement("li")
li.innerText=g.name+" ⭐ "+g.rating
list.appendChild(li)

})

}

updateRanking()

</script>

</body>
</html>
