<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎮 Luquinha Games</title>

<style>

body{
margin:0;
font-family:Arial;
background:black;
color:white;
text-align:center;
overflow-x:hidden;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* tela de carregamento */

#loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 1s forwards;
animation-delay:4s;
}

#loadingText{
font-size:55px;
color:#00ffff;
text-shadow:0 0 20px cyan;
animation:pulse 1.5s infinite;
}

.loader{
margin-top:20px;
width:70px;
height:70px;
border:6px solid #222;
border-top:6px solid cyan;
border-radius:50%;
animation:spin 1s linear infinite;
}

h1{
margin-top:20px;
font-size:45px;
text-shadow:0 0 20px cyan;
}

input{
padding:10px;
border-radius:10px;
border:none;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
background:cyan;
cursor:pointer;
}

/* biblioteca */

.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#111;
border-radius:15px;
padding:20px;
cursor:pointer;
transition:.3s;
box-shadow:0 0 15px rgba(0,255,255,.3);
}

.card:hover{
transform:scale(1.08);
box-shadow:0 0 30px cyan;
}

.icon{
font-size:70px;
}

#leaderboard{
background:#111;
margin:30px;
padding:20px;
border-radius:15px;
box-shadow:0 0 20px cyan;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

@keyframes pulse{
50%{transform:scale(1.1);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

</style>
</head>

<body>

<!-- loading -->

<div id="loading">
<h1 id="loadingText">🎮 LUQUINHA GAMES</h1>
<div class="loader"></div>
</div>

<canvas id="space"></canvas>

<h1>🎮 LUQUINHA GAMES</h1>

<input id="name" placeholder="Digite seu nome">
<button onclick="login()">Entrar</button>

<div id="profile"></div>

<!-- jogos -->

<div class="games">

<div class="card" onclick="play('https://luquinha835.github.io/capy-care-/','Capy Care')">
<div class="icon">🐹</div>
<h3>Capy Care</h3>
</div>

<div class="card" onclick="play('https://luquinha835.github.io/flypy-plane/','Flypy Plane')">
<div class="icon">✈️</div>
<h3>Flypy Plane</h3>
</div>

<div class="card" onclick="play('https://luquinha835.github.io/nave-game','Nave Space')">
<div class="icon">🚀</div>
<h3>Nave Space</h3>
</div>

<div class="card" onclick="play('https://luquinha835.github.io/desfio-matematico','Desafio Matemático')">
<div class="icon">🧠</div>
<h3>Desafio Matemático</h3>
</div>

<div class="card" onclick="play('https://luquinha835.github.io/marmot-game','Bater na Marmota')">
<div class="icon">🔨</div>
<h3>Bater na Marmota</h3>
</div>

<div class="card" onclick="play('https://classic.minecraft.net','Minecraft Classic')">
<div class="icon">🧱</div>
<h3>Minecraft Classic</h3>
</div>

<div class="card" onclick="play('https://www.figma.com/make/GzJgXyUa7kstmVc8ZNCpYD/Jogo-de-Terror-em-HTML?p=f&t=3iCBGKklE2VGvzEe-0&fullscreen=1','Mansão do Terror')">
<div class="icon">🏚️</div>
<h3>Mansão do Terror</h3>
</div>

<div class="card" onclick="play('https://luccabusscsm-creator.github.io/snake-game/','Snake Game')">
<div class="icon">🐍</div>
<h3>Snake Game</h3>
</div>

<div class="card" onclick="play('https://luccabusscsm-creator.github.io/mansmorra-sombria/','Masmorra Sombria')">
<div class="icon">🗝️</div>
<h3>Masmorra Sombria</h3>
</div>

</div>

<!-- ranking -->

<div id="leaderboard">

<h2>🏆 Ranking Global</h2>

<ul id="rankList"></ul>

</div>

<script>

/* login */

let player=""

function login(){

player=document.getElementById("name").value

localStorage.setItem("player",player)

document.getElementById("profile").innerHTML="🧑‍🚀 Jogador: "+player

}

/* jogar */

function play(url,game){

let score=Math.floor(Math.random()*100)

let data=JSON.parse(localStorage.getItem("scores")||"[]")

data.push({
name:player||"Anônimo",
game:game,
score:score
})

localStorage.setItem("scores",JSON.stringify(data))

window.open(url,"_blank")

updateRank()

}

/* ranking */

function updateRank(){

let data=JSON.parse(localStorage.getItem("scores")||"[]")

data.sort((a,b)=>b.score-a.score)

let html=""

data.slice(0,10).forEach(p=>{
html+=`<li>${p.name} - ${p.game} (${p.score})</li>`
})

document.getElementById("rankList").innerHTML=html

}

updateRank()

/* fundo espacial */

const canvas=document.getElementById("space")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let stars=[]

for(let i=0;i<150;i++){

stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2
})

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="white"

stars.forEach(s=>{

ctx.beginPath()
ctx.arc(s.x,s.y,s.r,0,Math.PI*2)
ctx.fill()

s.y+=0.3

if(s.y>canvas.height){
s.y=0
}

})

requestAnimationFrame(draw)

}

draw()

</script>

</body>
</html>
